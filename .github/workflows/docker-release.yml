name: CI and release (Windows EXE + Docker)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish image, CunZoom.exe and GitHub release after successful tests
        type: boolean
        default: false
      version:
        description: Release version without v
        type: string
        default: '2.1.0'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_source.py
      - name: Check Understand Anything workflow map matches source
        run: python scripts/workflow_map.py check
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
  windows:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # The Zoom SDK archive is never committed. It is read from a vendor release; keep that repo private and set
      # secrets.WINDOWS_SDK_TOKEN (read access) once it is. See docs/WINDOWS.md.
      SDK_REPO: ${{ vars.WINDOWS_SDK_REPO || 'Thequancute215-sys/AI-Zoom' }}
      SDK_TAG: ${{ vars.WINDOWS_SDK_TAG || 'sdk-7.2.1' }}
      SDK_ASSET: zoom-sdk-csharp-wrapper-7.2.1.49056.zip
      SDK_SHA256: 67ba466b38bdaa61df95b892398996d2a1c6db328b19a42ad814ec32d91dcb83
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-windows-lock.txt
      - name: Install locked Windows dependencies
        run: python -m pip install -r requirements-windows-lock.txt
      - name: Unit and loopback API tests on Windows
        run: python -m unittest discover -s tests -v
      - name: Get official Windows SDK from the vendor release
        id: sdk
        env:
          GH_TOKEN: ${{ secrets.WINDOWS_SDK_TOKEN || github.token }}
          SDK_TOKEN_SET: ${{ secrets.WINDOWS_SDK_TOKEN != '' }}
        run: |
          New-Item -ItemType Directory -Path build/vendor -Force | Out-Null
          gh release download $env:SDK_TAG --repo $env:SDK_REPO --pattern $env:SDK_ASSET --dir build/vendor
          if ($LASTEXITCODE -ne 0) {
            # Say which fix applies without ever printing the token.
            if ($env:SDK_TOKEN_SET -ne 'true') { Write-Output '::warning::Secret WINDOWS_SDK_TOKEN is not set for this repository (Settings > Secrets and variables > Actions > Repository secrets).' }
            else { Write-Output "::warning::WINDOWS_SDK_TOKEN is set but cannot read release $env:SDK_TAG of $env:SDK_REPO. The token needs Contents: Read-only on that repository." }
            if ($env:PUBLISH -eq 'true') { throw "Cannot read $env:SDK_ASSET from $env:SDK_REPO. See docs/WINDOWS.md." }
            Write-Output '::warning::Windows SDK unavailable; Windows tests passed but CunZoom.exe was not built.'
            'available=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $hash = (Get-FileHash "build/vendor/$env:SDK_ASSET" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:SDK_SHA256) { throw 'Windows SDK archive checksum mismatch.' }
          python scripts/prepare_sdk.py "build/vendor/$env:SDK_ASSET"
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare the Windows SDK.' }
          'available=true' >> $env:GITHUB_OUTPUT
      - name: Compile native Zoom worker
        if: steps.sdk.outputs.available == 'true'
        run: python scripts/build_native.py
      - name: Package CunZoom.exe
        if: steps.sdk.outputs.available == 'true'
        run: python scripts/build.py
      - name: Verify packaged application without joining a meeting
        if: steps.sdk.outputs.available == 'true'
        run: |
          # The exe ships without the SDK; point the self-test at the CI copy, as a user's installed SDK would be.
          $env:CUN_ZOOM_SDK_DIR = (Resolve-Path vendor/zoom/bin).Path
          $process = Start-Process -FilePath (Resolve-Path dist/CunZoom.exe) -ArgumentList '--self-test', 'dist/self-test.json', '--data-dir', 'build/smoke-data', '--no-migrate' -Wait -PassThru
          Get-Content dist/self-test.json
          if ($process.ExitCode -ne 0) { throw 'Packaged self-test failed.' }
          $report = Get-Content dist/self-test.json | ConvertFrom-Json
          if (-not $report.sdk_loadable -or -not $report.encryption_roundtrip -or -not $report.https_context) { throw 'Missing runtime, HTTPS context or encryption failed.' }
          if ($report.sdk_bundled -or (Get-Content dist/build-info.json | ConvertFrom-Json).zoom_sdk_included) { throw 'CunZoom.exe must not contain the Zoom SDK.' }
      - name: Keep tested executable for this run
        if: steps.sdk.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CunZoom-windows
          path: |
            dist/CunZoom.exe
            dist/SHA256SUMS.txt
            dist/build-info.json
            dist/self-test.json
          retention-days: 14
          if-no-files-found: error
  docker:
    needs: [checks, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build public image without proprietary SDK
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cun-zoom-ci:tested
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run image and real HTTP smoke tests
        run: |
          docker run -d --name cun-zoom-test -p 127.0.0.1:18767:18766 -e PUBLIC_ORIGIN=http://127.0.0.1:18767 cun-zoom-ci:tested
          python3 scripts/smoke_container.py cun-zoom-test
      - name: Container diagnostics
        if: failure()
        run: docker logs --tail=120 cun-zoom-test || true
      - name: Validate release version
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[a-z0-9.-]+)?",os.environ["VERSION"])'
          test "$(python3 -c 'import sys;sys.path.insert(0,"src");import paths;print(paths.VERSION)')" = "$VERSION"
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/ref/tags/v'+os.environ['VERSION']
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(req,timeout=20) as response:response.read()
          except urllib.error.HTTPError as error:
              if error.code!=404:raise
          else:raise SystemExit('Tag already exists; choose a new version. Existing image tags will not be overwritten.')
          PY
      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag cun-zoom-ci:tested "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          docker tag cun-zoom-ci:tested "$IMAGE:latest"
          docker push "$IMAGE:latest"
      - name: Get tested Windows executable
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: actions/download-artifact@v4
        with:
          name: CunZoom-windows
          path: windows-dist
      - name: Package clean source
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          cp windows-dist/CunZoom.exe dist/CunZoom.exe
          cp windows-dist/build-info.json dist/CunZoom-build-info.json
          git archive --format=zip --prefix="cun-zoom-$VERSION/" HEAD > "dist/cun-zoom-$VERSION-source.zip"
          cp compose.yaml dist/compose.yaml
          cp docs/INSTALL.md dist/HUONG-DAN-CAI-DAT.md
          cd dist
          sha256sum * > SHA256SUMS
      - name: Create release and attach source
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Cún Zoom $VERSION · Windows + Docker" --notes-file docs/RELEASE_NOTES.md dist/*
      - name: Stop smoke container
        if: always()
        run: docker rm -f cun-zoom-test || true
