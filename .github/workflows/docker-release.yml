name: Docker CI and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish image and GitHub release after successful tests
        type: boolean
        default: false
      version:
        description: Release version without v
        type: string
        default: '2.0.0'
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_source.py
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
  docker:
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build public image without proprietary SDK
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cun-zoom-ci:tested
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run image and real HTTP smoke tests
        run: |
          docker run -d --name cun-zoom-test -p 127.0.0.1:18767:18766 -e PUBLIC_ORIGIN=http://127.0.0.1:18767 cun-zoom-ci:tested
          python3 scripts/smoke_container.py cun-zoom-test
      - name: Container diagnostics
        if: failure()
        run: docker logs --tail=120 cun-zoom-test || true
      - name: Validate release version
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[a-z0-9.-]+)?",os.environ["VERSION"])'
          test "$(python3 -c 'import sys;sys.path.insert(0,"src");import paths;print(paths.VERSION)')" = "$VERSION"
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/ref/tags/v'+os.environ['VERSION']
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(req,timeout=20) as response:response.read()
          except urllib.error.HTTPError as error:
              if error.code!=404:raise
          else:raise SystemExit('Tag already exists; choose a new version. Existing image tags will not be overwritten.')
          PY
      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag cun-zoom-ci:tested "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          docker tag cun-zoom-ci:tested "$IMAGE:latest"
          docker push "$IMAGE:latest"
      - name: Package clean source
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="cun-zoom-$VERSION/" HEAD > "dist/cun-zoom-$VERSION-source.zip"
          cp compose.yaml dist/compose.yaml
          cp docs/INSTALL.md dist/HUONG-DAN-CAI-DAT.md
          cd dist
          sha256sum * > SHA256SUMS
      - name: Create release and attach source
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Cún Zoom $VERSION · Docker Linux" --notes-file docs/RELEASE_NOTES.md dist/*
      - name: Stop smoke container
        if: always()
        run: docker rm -f cun-zoom-test || true
