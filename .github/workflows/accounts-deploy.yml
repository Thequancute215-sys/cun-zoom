name: Deploy account portal
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: accounts-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: accounts-production
    defaults:
      run:
        working-directory: accounts
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ACCOUNTS_PUBLIC_ORIGIN: ${{ vars.ACCOUNTS_PUBLIC_ORIGIN }}
      ACCOUNTS_D1_DATABASE_ID: ${{ vars.ACCOUNTS_D1_DATABASE_ID }}
      ACCOUNTS_EMAIL_FROM: ${{ vars.ACCOUNTS_EMAIL_FROM }}
      ACCOUNTS_DOWNLOAD_URL: ${{ vars.ACCOUNTS_DOWNLOAD_URL }}
      ACCOUNTS_WORKER_NAME: ${{ vars.ACCOUNTS_WORKER_NAME }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: accounts/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Validate required secret bindings
        env:
          OTP_SECRET: ${{ secrets.OTP_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          node --input-type=module - <<'JS'
          for (const name of ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'OTP_SECRET', 'ADMIN_TOKEN', 'RESEND_API_KEY']) {
            if (!process.env[name] || (['OTP_SECRET', 'ADMIN_TOKEN'].includes(name) && process.env[name].length < 32)) {
              console.error('Missing or invalid binding: ' + name); process.exit(1);
            }
          }
          JS
      - run: node configure-production.mjs
      - run: npx wrangler deploy --dry-run --config .wrangler/production.json
      - name: Apply reviewed database migrations
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler/production.json
      - name: Deploy application
        run: npx wrangler deploy --config .wrangler/production.json
      - name: Install runtime secrets without logging values
        env:
          OTP_SECRET: ${{ secrets.OTP_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          node --input-type=module - <<'JS'
          import {spawnSync} from 'node:child_process';
          const secrets = Object.fromEntries(['OTP_SECRET', 'ADMIN_TOKEN', 'RESEND_API_KEY'].map(name => [name, process.env[name]]));
          const result = spawnSync('npx', ['wrangler', 'secret', 'bulk', '--config', '.wrangler/production.json'], {
            input: JSON.stringify(secrets), stdio: ['pipe', 'inherit', 'inherit']
          });
          process.exit(result.status ?? 1);
          JS
      - name: Check public health endpoint
        run: |
          node --input-type=module - <<'JS'
          const response = await fetch(process.env.ACCOUNTS_PUBLIC_ORIGIN + '/health', {redirect: 'error', signal: AbortSignal.timeout(15000)});
          const body = await response.json();
          if (!response.ok || body.product !== 'CunZoom Accounts') throw new Error('Production health check failed.');
          console.log('Production health endpoint passed. Real OTP and purchase flow still require acceptance testing.');
          JS
